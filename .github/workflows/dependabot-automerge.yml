name: Dependabot Automerge

on:
  schedule:
    # Dependabot checks updates on Mondays; merge eligible green PRs on Tuesday (UTC).
    - cron: "17 10 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: dependabot-automerge
  cancel-in-progress: false

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Merge green patch and minor Dependabot pull requests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          prs="$(gh pr list --repo "$REPO" --state open --limit 100 \
            --json number --jq '.[].number')"
          if [ -z "$prs" ]; then
            echo "No open pull requests found."
            exit 0
          fi

          while IFS= read -r pr; do
            [ -n "$pr" ] || continue
            pr_json="$(gh api "repos/$REPO/pulls/$pr")"
            author="$(jq -r '.user.login // ""' <<<"$pr_json")"
            head_ref="$(jq -r '.head.ref // ""' <<<"$pr_json")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
            base_ref="$(jq -r '.base.ref // ""' <<<"$pr_json")"
            head_sha="$(jq -r '.head.sha // ""' <<<"$pr_json")"

            if [ "$author" != "dependabot[bot]" ] ||
               [[ "$head_ref" != dependabot/* ]] ||
               [ "$head_repo" != "$REPO" ] ||
               [ "$base_ref" != "main" ] ||
               [ "$(jq -r '.draft' <<<"$pr_json")" != "false" ]; then
              continue
            fi

            # Match fetch-metadata's authenticated source: Dependabot's first,
            # verified commit. Unknown or incomplete metadata fails closed.
            commit_json="$(gh api "repos/$REPO/pulls/$pr/commits?per_page=1" --jq '.[0]')"
            if [ "$(jq -r '.author.login // ""' <<<"$commit_json")" != "dependabot[bot]" ] ||
               [ "$(jq -r '.commit.verification.verified' <<<"$commit_json")" != "true" ]; then
              echo "Leaving PR #$pr open: Dependabot commit is not verified."
              continue
            fi

            metadata="$(jq -r '.commit.message' <<<"$commit_json" |
              sed -n '/^---$/,/^\.\.\.$/p')"
            dependency_count="$(grep -Ec '^- dependency-name:' <<<"$metadata" || true)"
            type_count="$(grep -Ec '^  update-type:' <<<"$metadata" || true)"
            allowed_count="$(grep -Ec '^  update-type: version-update:semver-(patch|minor)$' <<<"$metadata" || true)"
            if [ "$dependency_count" -eq 0 ] ||
               [ "$type_count" -ne "$dependency_count" ] ||
               [ "$allowed_count" -ne "$dependency_count" ]; then
              echo "Leaving PR #$pr open: update is major or metadata is incomplete."
              continue
            fi

            checks_json="$(gh pr view "$pr" --repo "$REPO" --json statusCheckRollup --jq '
              [.statusCheckRollup[] | select(.workflowName != "Dependabot Automerge")]')"
            check_count="$(jq 'length' <<<"$checks_json")"
            if [ "$check_count" -eq 0 ] ||
               jq -e 'any(.[]; (.status != null and .status != "COMPLETED") or (.state != null and (.state == "PENDING" or .state == "EXPECTED")))' <<<"$checks_json" >/dev/null ||
               jq -e 'any(.[]; (.conclusion != null and (.conclusion != "SUCCESS" and .conclusion != "SKIPPED" and .conclusion != "NEUTRAL")) or (.state != null and .state != "SUCCESS"))' <<<"$checks_json" >/dev/null; then
              echo "Leaving PR #$pr open: checks are missing, pending, or failed."
              continue
            fi

            current_head="$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq '.headRefOid')"
            if [ "$current_head" != "$head_sha" ]; then
              echo "Leaving PR #$pr open: head changed during review."
              continue
            fi
            gh pr merge "$pr" --repo "$REPO" --squash --delete-branch \
              --match-head-commit "$head_sha"
            echo "Merged patch/minor Dependabot PR #$pr after $check_count successful checks."
          done <<<"$prs"
