name: Workflow Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout for read-only policy checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test dependency policy
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Verify Dependabot commit provenance
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/dependency_policy.py

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: devops-actions/actionlint@ec02b36684b2f574f1d219ad0a43b082e46bf3e4 # v0.1.13

  security:
    # The reusable workflow owns Gitleaks, zizmor and an explicit CodeQL analysis.
    # Advanced setup must be enabled in repository Code Security settings;
    # GitHub Default setup blocks uploads from advanced CodeQL.
    uses: qqrm-labs/.github/.github/workflows/security.yml@c7d0eef142baedc553738036fe7c648b3bbb4ee9
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      language: actions,rust
      codeql-mode: advanced

  workflow-security-gate:
    if: always()
    needs: [actionlint, security, dependency-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all security checks to succeed
        env:
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          POLICY_RESULT: ${{ needs.dependency-policy.result }}
        run: |
          test "$ACTIONLINT_RESULT" = success
          test "$SECURITY_RESULT" = success
          test "$POLICY_RESULT" = success
